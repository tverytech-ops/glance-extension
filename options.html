<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glance Settings</title><link rel="stylesheet" href="options.css"><script src="options.js" defer></script></head><body><main class="shell"><header class="top"><div class="mark">G</div><div><p class="eyebrow">GLANCE LINK PREVIEW</p><h1>Settings</h1><p class="sub">Make previews work the way you do.</p></div></header><section class="panel"><h2>Preview triggers</h2><label class="setting"><span><b>Alt + Click</b><small>Hold Alt while clicking a link.</small></span><input id="altClick" type="checkbox"></label><label class="setting"><span><b>Alt + Hover</b><small>Hold Alt and hover over a link to preview.</small></span><input id="hoverAlt" type="checkbox"></label><label class="setting"><span><b>Middle-click</b><small>Preview links with the middle mouse button.</small></span><input id="middleClick" type="checkbox"></label><label class="setting"><span><b>Right-click menu</b><small>Add a Glance preview action to the link context menu.</small></span><input id="contextMenu" type="checkbox"></label></section><section class="panel"><h2>Compatibility</h2><label class="setting"><span><b>Temporary frame compatibility</b><small>Remove X-Frame-Options only for the active preview host. CSP remains untouched. This may not work on every site.</small></span><input id="frameStripping" type="checkbox"></label><p class="notice">Websites can still block embedding through Content Security Policy, browser restrictions, authentication rules, or other mechanisms.</p></section><section class="panel"><h2>Modal dimensions</h2><label class="range"><span>Width <output id="widthValue">88%</output></span><input id="modalWidth" type="range" min="55" max="98" value="88"></label><label class="range"><span>Height <output id="heightValue">88%</output></span><input id="modalHeight" type="range" min="55" max="98" value="88"></label></section><footer><span id="status" role="status">Settings are saved automatically.</span><button id="reset" type="button">Reset defaults</button></footer></main></body></html>
